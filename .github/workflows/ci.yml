name: CI

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_DEMO_MODE: "false"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Validate source and types
        run: npm run check
      - name: Validate backlog
        run: npm run check:backlog
      - name: Validate production Compose file
        env:
          CAMPUS_RELEASE_TAG: ci
          CAMPUS_RUNTIME_ENV_FILE: /dev/null
        run: docker compose --env-file /dev/null -f deploy/compose.prod.yml config --quiet
      - name: Test production preflight
        run: node --import tsx --test deploy/preflight.test.ts
      - name: Run offline regressions
        run: npm run test:offline
      - name: Build pilot bundle
        run: npm run build
