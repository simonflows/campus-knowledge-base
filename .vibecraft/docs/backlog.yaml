    description: >-
      Ты — Senior Full-Stack & UI/UX инженер (Next.js App Router, TypeScript,
      Tailwind CSS, shadcn/ui, DynamoDB/YDB).

      Перед тобой готовый на 85–90% проект «Единая каноническая база знаний,
      умный SEO/GEO-редактор, фактчекинг и аналитика для межуниверситетского
      кампуса "Южный Урал" (Челябинск)».


      В проекте уже реализованы 8 из 9 задач бэклога
      (.vibecraft/docs/backlog.yaml): дашборд, база карточек в DynamoDB
      (knowledge-cards), конструктор типов сущностей (knowledge-card-types),
      SEO/GEO-редактор (lib/editor.ts, lib/yandex-ai.ts), фактчекинг
      (lib/fact-check.ts), аналитика (lib/analytics.ts), синхронизация с Яндекс
      Диском (lib/yandex-disk.ts, lib/disk-sync-service.ts) и ролевая модель
      (lib/auth.ts).


      КРИТИЧЕСКИЕ ОГРАНИЧЕНИЯ (НЕ НАРУШАТЬ)

      1. Сохранить инфраструктуру и API: НЕ ломай и НЕ удаляй существующие
      серверные маршруты в app/api/, схему DynamoDB в lib/schema.ts, подключение
      к БД в lib/db.ts, BridgeProvider, HandshakeListener, Toaster и
      app/api/health/route.ts.

      2. Сохранить переменные окружения и демо-режим (fallback): система должна
      идеально работать как при наличии ключей (YANDEX_AI_STUDIO_API_KEY,
      YANDEX_AI_STUDIO_FOLDER_ID, YANDEX_DISK_OAUTH_TOKEN), так и в автономном
      демо-режиме (без ключей и без БД) на богатых эталонных данных, чтобы
      проект можно было протестировать сразу после запуска, а затем просто
      вставить API-ключи.


      ЧАСТЬ 1. ПОЛНЫЙ ТЕКСТ ТЕХНИЧЕСКОГО ЗАДАНИЯ (ДЛЯ СВЕРКИ ВСЕХ ФУНКЦИЙ)


      1. Цель и две задачи проекта

      - Задача 1 (Главный приоритет): Рабочий веб-сервис «одного окна» в
      российском контуре (152-ФЗ) для 7 вузов-резидентов кампуса «Южный Урал»,
      концессионера (ООО «ЧКК»), АНО «РИОН» и Минобрнауки Челябинской области с
      обязательным автоматическим резервированием данных на Яндекс Диске.

      - Задача 2 (Испытательный полигон, task-7580): Сравнение Yandex AI Studio
      и Alibaba Cloud Model Studio (Qwen) на открытых данных кампуса (без ПДн)
      по 4 критериям (простота для студентов без глубокого кода, качество
      фактчекинга и SEO/GEO-чанков, удобство конструкторов и работы с
      документами, стоимость и ограничения в РФ) + встроенная памятка для
      сотрудников вузов.


      2. Дерево папок в системе и на Яндекс Диске

      - 00_Кампус_общие_параметры/ — единый паспорт кампуса (площади, стоимость,
      сроки очередей, тарифы, юрлица) и стоп-лист частых ошибок.

      - 01_Вузы_резиденты/ — 7 папок по каждому вузу:
        1. ЮУрГУ (Южно-Уральский государственный университет)
        2. ЧелГУ (Челябинский государственный университет)
        3. МИДиС (Международный институт дизайна и сервиса — единственный частный вуз-резидент)
        4. ЮУГМУ (Южно-Уральский государственный медицинский университет)
        5. ЮУрГАУ (Южно-Уральский государственный аграрный университет)
        6. МГТУ им. Г. И. Носова (Магнитогорский государственный технический университет им. Г. И. Носова)
        7. ЮУрГГПУ (Южно-Уральский государственный гуманитарно-педагогический университет)
        Внутри папки каждого вуза — 5 подпапок: Паспорт_и_спикеры/, Инфраструктура_и_лаборатории/, Продукты_и_проекты/, Партнёры_и_соглашения/, Готовые_статьи/ (библиотека проверенных статей вуза, разбитых на чанки).
      - 02_Совместные_проекты/ — единая папка для межвузовских проектов
      (например, PROJ-COOP-001 «Виртуальный тренажёр травмпункта» — МИДиС +
      ЮУГМУ). В папках вузов-участников отображается ссылкой на единственную
      карточку.

      - Автодублирование: при создании/обновлении карточки или статьи она
      сохраняется в читаемом виде (.md + сводная таблица CSV) в ту же структуру
      папок на Яндекс Диске.


      3. Конструктор сущностей, два слоя знаний и права доступа

      - Конструктор типов карточек без программиста: админ может создавать новые
      типы сущностей («Проект», «Лаборатория», «Образовательная программа»,
      «Спикер/Учёный», «Индустриальный партнёр», «Мероприятие») и настраивать их
      поля.

      - Два уровня знаний:
        - Слой 1 (Канонические карточки): первоисточник твёрдых фактов, цифр, дат, статусов и авторства.
        - Слой 2 (Готовые статьи из Готовые_статьи/): источник живых формулировок, контекста и проверенных смысловых блоков.
      - Матрица ролей и «Правило владельца»:
        - Все 7 вузов абсолютно равноправны.
        - Читать базу, проверять тексты, генерировать статьи и собирать аналитику могут все авторизованные участники.
        - Добавлять новые карточки может представитель любого вуза (черновик уходит на подтверждение координатору, а для совместного проекта — второму вузу-участнику).
        - Редактировать утверждённую карточку могут ТОЛЬКО её владелец (или оба владельца в совместном проекте) и Администратор канона. Чужие карточки редактировать запрещено — для остальных участников доступна кнопка «Запросить правку / Отправить комментарий владельцу».

      4. Стандарты SEO / GEO и 4 сценария в одном окне

      - Стандарт SEO и GEO под капотом (температура 0–0.1, запрет на
      выдумывание):
        1. Живой язык без канцелярита.
        2. Сильные первые 1000 знаков: кто с кем сотрудничает, что создано, в каком контуре (кампус / ПИШ / УМНОЦ / площадка вуза) и практическая польза.
        3. Чёткая иерархия заголовков H1, H2, H3.
        4. Упаковка в самодостаточные смысловые чанки: каждый раздел (1–2 абзаца под H2/H3) явно называет вузов-участников, проект и цифры (без местоимений «они сделали там»), чтобы нейросети и поисковики могли цитировать блок целиком.
      - Алгоритм фактчекинга по 6 контрольным точкам:
        1. Общие параметры кампуса (00_Кампус_общие_параметры/).
        2. Статус и физическое размещение объекта («Действует на площадке вуза» vs «Планируется к открытию в УНК кампуса в 2027 году»).
        3. Авторство и соисполнители (не приписан ли совместный проект одному вузу или одному врачу/разработчику).
        4. Разделение контуров (не смешивать проекты кампуса «Южный Урал», ПИШ «Сердце Урала», УМНОЦ, молодёжные грантовые лаборатории вузов и федеральный пилот 5 регионов РФ).
        5. Официальные названия юрлиц, вузов, партнёров и ФИО/должностей спикеров.
        6. Неподтверждённые цифры (любые числа и метрики, которых нет в карточках).
      - Формат отчёта фактчекинга (Светофор):
        - 🔴 Красный уровень (прямое искажение фактов, публикация запрещена до правки) + «Как исправить» + ссылка на ID карточки.
        - 🟡 Жёлтый уровень (нет подтверждения в базе, требуется уточнение у владельца карточки).
        - 🟢 Зелёный уровень (подтверждено канонической базой).
        - Кнопка «Переписать по канону» — в один клик переписывает проверенный текст по стандартам SEO/GEO без ошибок.

      ЧАСТЬ 2. ПОЛНАЯ ВЫЖИМКА АУДИТА ИНФОПОЛЯ (66 КЕЙСОВ ИЗ PDF ДЛЯ ЗАШИВКИ В
      БАЗУ И ФАКТЧЕКЕР)

      Проверено 161 веб-страница (сайты ведомств, концессионера, 7 вузов, СМИ,
      соцсети за 2020–2026 гг., дата среза — 12.11.2026). Выявлено 66
      разночтений в 105 публикациях.


      Сводная таблица 12 главных противоречий (что должно быть в эталонном
      паспорте 00_Кампус_общие_параметры)

      1. Число вузов-резидентов: в источниках встречаются 5, 6 и 7. КАНОН: Ровно
      7 равноправных вузов-резидентов (ЮУрГУ, ЧелГУ, МИДиС, ЮУГМУ, ЮУрГАУ, МГТУ
      им. Г. И. Носова, ЮУрГГПУ). МИДиС — единственный частный вуз в проекте.

      2. Общая площадь объектов кампуса: в сети 6 вариантов (114, >120, 121,8,
      122, 123, 125 тыс. м²) + путаница с площадью земли (58,8 тыс. м² — два
      земельных участка). КАНОН: Общая площадь объектов по актуальным паспортам
      концессионера и финансового партнёра ВЭБ.РФ — 121,8–123 тыс. м² (жилая
      гостиничная часть — 68–70 тыс. м², УНК — 40,3 т��с. м² / точный метраж 40
      306 м²), площадь двух земельных участков — 58,8 тыс. м² (запрещено
      называть 114 тыс. м² площадью земли или актуальной общей площадью).

      3. Стоимость проекта и финансирование: в источниках 16,7, 16,75, 21,1,
      34,6 млрд ₽; путаница с капитальным грантом (9,13 млрд ₽ = 7,9 млрд ₽
      федеральный бюджет + 1,23 млрд ₽ областной бюджет, то есть доли 86,5% /
      13,5%, а не 90/10 и не сумма 9,13 + 7,9 + 1,23 = 18,26 млрд); в 2026 г.
      ВЭБ.РФ выделил 4 млрд ₽, а по нацпроекту «Молодёжь и дети» — дополнительно
      7,9 млрд ₽. КАНОН: Все суммы указывать строго с привязкой к году расчёта и
      структуре (исходная оценка концессии 2022 г. — 16,75 млрд ₽; совокупный
      объём инвестиций с учётом допфинансирования — до 34,6 млрд ₽; капитальный
      грант 2022 г. — 9,13 млрд ₽, включая 7,9 млрд фед. и 1,23 млрд рег.).

      4. Вместимость (проживание vs обучение): смешиваются 3 400, 3 500, 3 600 и
      5 000. КАНОН: 3 400 мест (в 8 гостиничных корпусах) — это вместимость для
      проживания студентов и преподавателей; 5 000 человек — это численность
      обучающихся в кампусе. Строго запрещено писать «проживать будут 5 000
      человек».

      5. Этапы (очереди) строительства и сроки ввода. КАНОН: Строительство
      разделено на 3 этапа:
         - 1-й этап (сдан в августе 2024 г.): 2 семиэтажные гостиницы на 336 мест (заселились первые ~148–300 студентов; запрещено писать «открыты в августе 2023 г.»).
         - 2-й этап (введён в сентябре 2026 г.: 11.09 — разрешение на ввод, 15.09 — вторник, официальное открытие): 6 гостиничных корпусов (4 шестнадцатиэтажных и 2 семиэтажных; 5 для студентов и 1 повышенной комфортности для НПС/преподавателей) на 3 064 места. Всего в 1-й и 2-й очередях: 2 + 6 = 8 гостиниц на 3 400 мест (запрещено писать «9 гостиниц» или «3 400 мест только во второй очереди»).
         - 3-й этап (завершение строительства — конец 2027 г., полный запуск всей инфраструктуры — 2028 г.): Учебно-научный комплекс (УНК) площадью 40,3 тыс. м² (40 306 м²) и модульный конференц-зал.
      6. Лаборатории УНК vs Молодёжные лаборатории вузов: в источниках 40, 43,
      44 лаборатории, 12 занятых резидентами, плюс смешение с 3 / 4 / 5
      региональными молодёжными грантовыми лабораториями в вузах. КАНОН: В
      строящемся УНК (3-я очередь, открытие в 2027 г.) проектируется до 40–44
      лабораторий (на осень 2026 г. 12 закреплены за индустриальными партнёрами,
      ещё ~20 на стадии согласования). До ввода УНК в 2027 году ни одна
      лаборатория физически не работает в здании УНК кампуса — все действующие
      лаборатории сейчас работают на собственных площадках вузов. Региональные
      молодёжные лаборатории — отдельный грантовый контур на базе вузов.

      7. Продуктовый портфель (83/84 vs 245). КАНОН: Региональный продуктовый
      портфель кампуса «Южный Урал» в Челябинске включает 8 продуктовых программ
      и 83–84 продукта/решения. Цифра «37 продуктовых программ и 245 решений»
      относится к сводному итогу 5 пилотных регионов РФ Минобрнауки —
      приписывать 245 решений одному Челябинску категорически запрещено.

      8. Юридические роли и операторы. КАНОН:
         - Концессионер: ООО «Челябинская концессионная компания» (ООО «ЧКК») (инвестор / холдинг — ВТБ Инфраструктурный холдинг, финансовый партнёр — ВЭБ.РФ; форма — концессионное соглашение в рамках ГЧП).
         - Технический заказчик: компания «ВТБ Девелопмент» (стоп-слова/опечатки: «ВТД Девелопмент», «кампания ВТБ Девелопмент»).
         - Оператор целевой эксплуатации гостиниц: ООО «Отельные решения» (г. Екатеринбург), категория сервиса — «Три звезды», еженедельная уборка и смена белья, собственные санузлы в номерах и общие кухни на блок, тарифы 2026/27 уч. года: двухместный 10 900 ₽ (16-эт.) / 11 900 ₽ (7-эт.), трёхместный 8 500 ₽/мес., одноместный от 16 800 ₽/мес., «Три звезды» — 4 750 ₽/сутки (старый тариф 8 600 ₽ от 2024 г. помечать как устаревший).
         - Национальный проект: проект стартовал в рамках нацпроекта «Наука и университеты», а с 2025 года реализуется в рамках национального проекта «Молодёжь и дети».

      Ключевые кейсы по конкретным проектам, партнёрам и терминологии (Кейсы
      49–66)

      - Кейс 59 («Виртуальный тренажёр травмпункта», PROJ-COOP-001): строго
      совместный проект МИДиС (3D-моделирование, дизайн цифровых сред, геймдев)
      и ЮУГМУ (медицинская экспертиза, клинические сценарии, руководитель от
      ЮУГМУ — Артур Шамселов). Красный флаг: приписывание проекта одному вузу,
      только одному врачу Артуру Шамселову или указание непроверенной метрики
      «прошли обучение 5 000 врачей».

      - Кейсы 60–61 (Лаборатория МИДиС и робот KUKA): робот-манипулятор KUKA
      сейчас действует на площадке МИДиС (вырезает скульптуры и прототипы из
      пенопласта, дерева, металла). Партнёр будущей лаборатории промышленного и
      архитектурного дизайна МИДиС в УНК кампуса — девелопер ГК «Голос» (ранее в
      2023 г. прорабатывался Центр промдизайна с ГК inSmart). Красный флаг:
      слова-искажения «кинопласт» (вместо пенопласта), «робот Куки» (вместо
      KUKA), а также утверждение, что робот KUKA уже стоит в новом корпусе УНК
      кампуса.

      - Кейс 52 (Партнёр inSmart): ГК inSmart сотрудничает и с ЧелГУ
      (лаборатория микроэлектроники и радиофизики), и с МИДиС — при аналитике
      уникальных партнёров не дублировать компанию дважды.

      - Кейс 54 (ПО для пятиосевых станков с ЧПУ — ЧелГУ): проект ЧелГУ по
      программированию ПЛК и сервоприводов (в т.ч. Yaskawa) не смешивать со
      сторонними станками в «полностью отечественную аппаратную систему кампуса
      без импортных узлов».

      - Кейс 55 (Промышленные роботы — ЮУрГУ и «Завод Роботов» / «Русский
      робот»): опытное производство в УНК кампуса только планируется; двигатели
      и сервоприводы частично импортируются.

      - Кейс 56 (Арктический автобус «Арктика» Урал-427701 — ЮУрГУ и АЗ «Урал»):
      разработка 2022–2023 гг., показанная на выставке при открытии 2-й очереди
      гостиниц.

      - Кейс 57 (ПИШ «Сердце Урала» — ЮУрГУ): бесшумная электрическая
      коммунальная машина и дистанционный погрузчик — это проекты федерального
      контура Передовой инженерной школы (ПИШ) «Сердце Урала» ЮУрГУ, не
      приписывать их напрямую бюджету кампуса без указания контура ПИШ.

      - Кейс 58 (Экомониторинг — ЮУрГУ): различать модель расчёта SUSUPLUME (в
      100 раз быстрее) и программно-аппаратный комплекс «Экомонитор» (вдвое
      дешевле при внедрении и в 5 раз при эксплуатации).

      - Кейсы 62–66 (Фамилии, должности, аббревиатуры):
        - Главный федеральный инспектор по Челябинской области — Денис Чернятьев (стоп-ошибка: «Денис Чертьев»).
